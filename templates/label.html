<!DOCTYPE html>
<html>
<head>
    <title>Label - {{ item.uid }}</title>
    <style>
        /* Screen Styles */
        body { 
            margin: 0; 
            padding: 0; 
            font-family: sans-serif; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            background-color: #f0f0f0;
        }

        /* The Label Preview Box */
        .label-container {
            background: white;
            width: 300px; /* Approximate width of a standard label */
            padding: 20px;
            border: 2px solid black;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 { 
            margin: 0 0 5px 0; 
            font-size: 22px; 
            text-transform: uppercase; 
            word-wrap: break-word;
            line-height: 1.2;
        }

        p.location { 
            margin: 5px 0; 
            font-size: 18px; 
            font-weight: bold; 
            color: #333;
        }

        img.qr {
            width: 180px; 
            height: 180px;
            /* Keeps pixels sharp for scanners */
            image-rendering: pixelated; 
            margin: 10px 0;
        }

        .uid { 
            font-family: monospace; 
            font-size: 12px; 
            color: #555; 
            display: block;
        }

        /* Buttons (Hidden when printing) */
        .no-print { margin-top: 20px; display: flex; gap: 10px; }
        
        button, a.btn { 
            padding: 12px 24px; 
            font-size: 16px; 
            cursor: pointer; 
            border: none; 
            border-radius: 4px; 
            text-decoration: none; 
            font-weight: bold;
        }
        
        button { background: #007bff; color: white; }
        button:hover { background: #0056b3; }
        
        a.btn { background: #6c757d; color: white; }
        a.btn:hover { background: #5a6268; }

        /* --- PRINT MODE STYLES --- */
        @media print {
            body { 
                background: white; 
                display: block; 
                height: auto; 
                margin: 0; 
                padding: 0;
            }
            .no-print { display: none; }
            
            .label-container {
                width: 100%; 
                max-width: 100%;
                border: none; 
                box-shadow: none; 
                padding: 0;
                margin: 0;
                /* Center on the physical paper */
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
            }
            
            /* Ensure QR is high contrast black/white */
            img.qr { width: 60%; height: auto; }
        }
    </style>
</head>
<body>

    <!-- Label Content -->
    <div class="label-container">
        <h1>{{ item.name }}</h1>
        <p class="location">{{ item.location or "" }}</p>
        
        <!-- QR Code generated by backend route -->
        <img src="/items/{{ item.uid }}/qr" class="qr" alt="QR Code">
        
        <span class="uid">{{ item.uid }}</span>
    </div>

    <!-- Controls -->
    <div class="no-print">
        <button onclick="window.print()">🖨️ Print Label</button>
        <a href="/items/{{ item.uid }}" class="btn">Close</a>
    </div>

</body>
</html>
