<!DOCTYPE html>
<html>
<head>
    <title>{{ item.name }} - Details</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f6f8; padding: 40px; }
        .container { max-width: 700px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        
        .back-link { display: inline-block; margin-bottom: 20px; text-decoration: none; color: #6c757d; font-weight: bold; }
        .back-link:hover { color: #333; }

        h1 { margin-top: 0; font-size: 2rem; color: #333; border-bottom: 2px solid #f0f0f0; padding-bottom: 15px; }
        
        .property { margin-bottom: 20px; }
        .label { font-weight: bold; color: #555; display: block; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px; }
        .value { font-size: 1.1rem; color: #000; }
        .uid { font-family: monospace; background: #eee; padding: 2px 6px; border-radius: 4px; }
        
        /* EDITABLE STYLES */
        .editable {
            cursor: pointer;
            border-bottom: 1px dashed #ccc;
            padding: 2px 0;
            transition: background 0.2s;
            display: inline-block;
            min-width: 200px; /* Make sure there is clickable area even if empty */
        }
        .editable:hover { background-color: #fff3cd; }
        .editable:hover::after {
            content: " ✎";
            color: #888;
            font-size: 0.8em;
        }
        
        /* NOTE SPECIFIC STYLES */
        .note-box {
            background-color: #fff9db;
            padding: 15px;
            border-radius: 4px;
            border: 1px dashed #ccc;
            min-height: 60px;
            cursor: pointer;
            white-space: pre-wrap; 
            transition: background 0.2s;
            position: relative;
        }
        .note-box:hover { background-color: #fff3cd; border-color: #999; }
        .note-box:empty:before { content: "Click to add a note..."; color: #888; font-style: italic; }
        .note-box:hover::after { content: "✎ Click to edit"; position: absolute; top: 5px; right: 5px; font-size: 0.7em; color: #999; }

        /* INPUT STYLES FOR EDITING */
        .edit-input {
            font-size: 1.1rem;
            width: 100%;
            padding: 5px;
            border: 2px solid #007bff;
            border-radius: 4px;
            box-sizing: border-box;
        }
        textarea.edit-mode {
            width: 100%;
            height: 100px;
            padding: 10px;
            font-family: sans-serif;
            font-size: 1rem;
            border: 2px solid #007bff;
            border-radius: 4px;
            box-sizing: border-box;
            resize: vertical;
        }

        .photo-container { margin-top: 10px; text-align: center; background: #fafafa; padding: 20px; border-radius: 8px; border: 1px dashed #ccc; }
        img { max-width: 100%; height: auto; border-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        
        .footer { margin-top: 30px; font-size: 0.8rem; color: #999; text-align: center; border-top: 1px solid #eee; padding-top: 10px;}
    </style>
</head>
<body>
    <div class="container">
        <a href="/dashboard" class="back-link">&larr; Back to Dashboard</a>

        <h1>{{ item.name }}</h1>

        <!-- NOTES SECTION -->
        <div class="property">
            <span class="label">Notes</span>
            <div id="note-display" class="note-box" onclick="editNote()">{{ item.note or '' }}</div>
        </div>

        <!-- UPDATED: LOCATION SECTION -->
        <div class="property">
            <span class="label">Location</span>
            <div id="location-display" class="value editable" onclick="editLocation()">
                {{ item.location or "Click to set location" }}
            </div>
        </div>

        <div class="property">
            <span class="label">Photo</span>
            {% if item.photo %}
                <div class="photo-container">
                    <img src="/static/{{ item.photo }}" alt="{{ item.name }}">
                </div>
            {% else %}
                <div class="photo-container" style="color: #999;">
                    No photo available
                </div>
            {% endif %}
        </div>

        <div class="property" style="margin-top: 20px;">
            <span class="label">Unique ID</span>
            <span class="value uid">{{ item.uid }}</span>
        </div>

        <div class="footer">
            Last Updated: {{ item.date }}
        </div>
    </div>

    <!-- JAVASCRIPT -->
    <script>
        const uid = "{{ item.uid }}";
        
        // --- NOTE EDITING LOGIC ---
        const noteDisplay = document.getElementById("note-display");
        let isEditingNote = false;

        function editNote() {
            if (isEditingNote) return;
            isEditingNote = true;
            const currentText = noteDisplay.innerText;
            const textarea = document.createElement("textarea");
            textarea.className = "edit-mode";
            textarea.value = currentText;
            noteDisplay.replaceWith(textarea);
            textarea.focus();

            function saveNote() {
                const newText = textarea.value.trim();
                noteDisplay.innerText = newText;
                textarea.replaceWith(noteDisplay);
                isEditingNote = false;
                fetch(`/items/${uid}/note`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ note: newText })
                });
            }
            textarea.addEventListener("blur", saveNote);
            textarea.addEventListener("keydown", function(e) {
                if ((e.ctrlKey || e.metaKey) && e.key === "Enter") saveNote();
            });
        }

        // --- LOCATION EDITING LOGIC ---
        const locDisplay = document.getElementById("location-display");
        let isEditingLoc = false;

        function editLocation() {
            if (isEditingLoc) return;
            isEditingLoc = true;

            const currentVal = locDisplay.innerText === "Click to set location" ? "" : locDisplay.innerText;
            
            // Create Input
            const input = document.createElement("input");
            input.type = "text";
            input.className = "edit-input";
            input.value = currentVal;

            // Swap UI
            locDisplay.replaceWith(input);
            input.focus();

            function saveLoc() {
                const newVal = input.value.trim();
                
                // Update UI text (or placeholder if empty)
                locDisplay.innerText = newVal || "Click to set location";
                
                // Swap back
                input.replaceWith(locDisplay);
                isEditingLoc = false;

                // Send to Backend
                fetch(`/items/${uid}/location`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ location: newVal })
                });
            }

            // Save on blur or Enter key
            input.addEventListener("blur", saveLoc);
            input.addEventListener("keydown", function(e) {
                if (e.key === "Enter") saveLoc();
            });
        }
    </script>
</body>
</html>
