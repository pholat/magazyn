<!DOCTYPE html>
<html>
<head>
    <title>{{ item.name }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    
    <!-- JS -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js" defer></script>
    <script>window.availableLocations = {{ locations | tojson }};</script>
    <script src="/static/js/scripts.js" defer></script>

    <style>
        body { font-family: sans-serif; background-color: #f4f6f8; padding: 20px; margin: 0; }
        .container { max-width: 700px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .back-link { display: inline-block; margin-bottom: 20px; text-decoration: none; color: #6c757d; font-weight: bold; font-size: 1.1em; }
        
        h1 { margin-top: 0; border-bottom: 2px solid #f0f0f0; padding-bottom: 15px; font-size: 1.8em; word-wrap: break-word; }
        
        .property { margin-bottom: 25px; }
        .label { font-weight: bold; color: #555; display: block; font-size: 0.85rem; text-transform: uppercase; margin-bottom: 8px; }
        
        .editable-box { padding: 12px; border-radius: 6px; border: 1px dashed #ccc; cursor: pointer; position: relative; transition: 0.2s; background: #fafafa; font-size: 1.1em; word-wrap: break-word; }
        .editable-box:hover { background-color: #fff3cd; border-color: #999; }
        .editable-box:hover::after { content: "✎ Edit"; position: absolute; top: 5px; right: 5px; font-size: 0.7em; color: #666; }
        
        .note-box { background-color: #fff9db; min-height: 80px; white-space: pre-wrap; }
        
        /* Inputs generated by JS */
        input.edit-input, textarea.edit-input { width: 100%; padding: 12px; font-size: 1.1em; border: 2px solid #007bff; border-radius: 4px; box-sizing: border-box; font-family: sans-serif; }
        
        /* Select2 Override */
        .select2-container { display: block; width: 100% !important; }
        
        img { max-width: 100%; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: block; margin: 0 auto; }
        
        .footer { margin-top: 30px; border-top: 1px solid #eee; padding-top: 15px; font-size: 0.9em; color: #999; text-align: center; }
        .uid-val { font-family: monospace; cursor: pointer; background: #eee; padding: 2px 5px; border-radius: 4px; }
        
        .btn-qr { display:block; width:100%; background:#6c757d; color:white; padding:12px; text-align:center; text-decoration:none; border-radius:6px; font-weight:bold; margin-top:15px; box-sizing: border-box; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/dashboard" class="back-link">&larr; Dashboard</a>
        
        <h1>{{ item.name }}</h1>

        <!-- NOTES -->
        <div class="property">
            <span class="label">Notes</span>
            <div id="note-display" class="editable-box note-box" 
                 onclick="editItemField('note-display', 'note', '{{ item.uid }}')">
                 {{ item.note or 'Click to add note...' }}
            </div>
        </div>

        <!-- LOCATION -->
        <div class="property">
            <span class="label">Location</span>
            <div id="loc-display" class="editable-box" 
                 onclick="editItemField('loc-display', 'location', '{{ item.uid }}')">
                 {{ item.location or 'Set Location' }}
            </div>
        </div>

        <!-- DATE -->
        <div class="property">
            <span class="label">Created / Modified Date</span>
            <!-- 'date' type triggers datetime logic in scripts.js -->
            <div id="date-display" class="editable-box" 
                 onclick="editItemField('date-display', 'date', '{{ item.uid }}')">
                 {{ item.date }}
            </div>
        </div>

        <!-- PHOTO -->
        <div class="property">
            <span class="label">Photo</span>
            {% if item.photo %}
                <img src="/static/{{ item.photo }}" alt="{{ item.name }}">
            {% else %}
                <div style="color:#999; font-style:italic; text-align:center; padding:20px; background:#f9f9f9;">No photo</div>
            {% endif %}
        </div>

        <a href="/items/{{ item.uid }}/label" target="_blank" class="btn-qr">🖨️ Print QR Label</a>

        <div class="footer">
            UID: <span class="uid-val" onclick="copyToClipboard('{{ item.uid }}', this)">{{ item.uid }} 📋</span>
        </div>
    </div>
</body>
</html>
