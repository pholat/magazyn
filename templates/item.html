<!DOCTYPE html>
<html>
<head>
    <title>{{ item.name }}</title>
    
    <!-- 1. Import jQuery & Select2 -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

    <!-- 2. Pass Data to JS -->
    <script>
        window.availableLocations = {{ locations | tojson }};
    </script>

    <!-- 3. Custom Script -->
    <script src="/static/js/scripts.js" defer></script>

    <style>
        body { font-family: sans-serif; background-color: #f4f6f8; padding: 40px; }
        .container { max-width: 700px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .back-link { display: inline-block; margin-bottom: 20px; text-decoration: none; color: #6c757d; font-weight: bold; }
        h1 { margin-top: 0; border-bottom: 2px solid #f0f0f0; padding-bottom: 15px; }
        .property { margin-bottom: 20px; }
        .label { font-weight: bold; color: #555; display: block; font-size: 0.85rem; text-transform: uppercase; margin-bottom: 5px; }
        
        .editable-box { padding: 10px; border-radius: 4px; border: 1px dashed #ccc; cursor: pointer; position: relative; transition: 0.2s; }
        .editable-box:hover { background-color: #fff3cd; border-color: #999; }
        .editable-box:hover::after { content: "✎ Edit"; position: absolute; top: 5px; right: 5px; font-size: 0.7em; color: #666; }
        .note-box { background-color: #fff9db; min-height: 60px; white-space: pre-wrap; }

        .select2-container { display: block; width: 100% !important; }
        
        textarea.edit-input { width: 100%; padding: 10px; font-size: 1rem; border: 2px solid #007bff; border-radius: 4px; box-sizing: border-box; }
        img { max-width: 100%; border-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="container">
        <a href="/dashboard" class="back-link">&larr; Back to Dashboard</a>
        <h1>{{ item.name }}</h1>

        <div class="property">
            <span class="label">Notes</span>
            <div id="note-display" class="editable-box note-box" 
                 onclick="editItemField('note-display', 'note', '{{ item.uid }}')">
                 {{ item.note or 'Click to add note...' }}
            </div>
        </div>

        <div class="property">
            <span class="label">Location</span>
            <div id="loc-display" class="editable-box" 
                 onclick="editItemField('loc-display', 'location', '{{ item.uid }}')">
                 {{ item.location or 'Set Location' }}
            </div>
        </div>

        <div class="property">
            <span class="label">Photo</span>
            {% if item.photo %}
                <div style="text-align:center; background:#fafafa; padding:20px; border:1px dashed #ccc; border-radius:8px;">
                    <img src="/static/{{ item.photo }}">
                </div>
            {% else %}
                <div style="color:#999; font-style:italic;">No photo available</div>
            {% endif %}
        </div>

        <div class="property" style="margin-top:30px; border-top:1px solid #eee; padding-top:10px; font-size:0.8em; color:#999;">
            UID: {{ item.uid }} <br> Last Updated: {{ item.date }}
        </div>
    </div>
</body>
</html>
